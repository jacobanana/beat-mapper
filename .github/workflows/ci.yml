name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same script the Claude commit hook runs, so a branch that was
      # green in a phone session is green here for the same reasons.
      - name: Checks (typecheck + lint + unit tests)
        run: bash scripts/checks.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
